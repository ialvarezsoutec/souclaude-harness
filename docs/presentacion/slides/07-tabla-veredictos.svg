 el</tspan></text><text x="156" y="221.32" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan font-weight="650" fill="#13171E">harness hoy</tspan><tspan>.</tspan></text><g id="table"><text x="156" y="269" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="1.5" fill="#5C6573" text-anchor="start">EN DISCO</text><text x="478.24" y="269" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="1.5" fill="#5C6573" text-anchor="start">EN EL LOCKFILE</text><text x="749.5999999999999" y="269" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="1.5" fill="#5C6573" text-anchor="start">¿CAMBIÓ EL TEMPLATE?</text><text x="1004" y="269" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="1.5" fill="#5C6573" text-anchor="start">VEREDICTO</text><text x="1275.3600000000001" y="269" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="1.5" fill="#5C6573" text-anchor="start">QUÉ PASA</text><line x1="156" y1="281" x2="1852" y2="281" stroke="#BBC3CE" stroke-width="1"/><text x="156" y="305.48" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>no está</tspan></text><text x="478.24" y="305.48" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>no está</tspan></text><text x="749.5999999999999" y="305.48" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>—</tspan></text><circle cx="1009" cy="301" r="