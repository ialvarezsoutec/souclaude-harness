Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="16" font-weight="600" fill="#B23A26">conflict</text><text x="1275.3600000000001" y="500.48" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan font-weight="650" fill="#13171E">Nunca se pisa</tspan><tspan> → queda </tspan><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="14.4" fill="#13171E">.new</tspan><tspan> al lado.</tspan></text><line x1="156" y1="521" x2="1852" y2="521" stroke="#D2D7DF" stroke-width="1"/><text x="156" y="539.48" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>lo escribimos, lo borraste</tspan></text><text x="478.24" y="539.48" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>está</tspan></text><text x="749.5999999999999" y="539.48" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>—</tspan></text><circle cx="1009" cy="535" r="4.5" fill="#0F7A4A"/><text x="1019" y="541" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="16" font-weight="600" fill="#0F7A4A">restore</text><text x="1275.3600000000001" y="539.48" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Se reescribe.</tspan></text><line x1="156" y1="560" x2="1852" y2="560" stroke="#D2D7DF" stroke-width="1"/><text x="156" y="578.48" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>está</tspan></text><text x="478.24" y="578.48" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>ya no en el manifest</tspan></text><text x="749.5999999999999" y="578.48" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>—</tspan></text><circle cx="1009" cy="574" r="4.5" fill="#B23A26"/><text x="1019" y="580" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="16" font-weight="600" fill="#B23A26">obsolete</text><text x="1275.3600000000001" y="578.48" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Solo con </tspan><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="14.4" fill="#13171E">--prune</tspan><tspan> y doble confirmación.</tspan></text><line x1="156" y1="599" x2="1852" y2="599" stroke="#D2D7DF" stroke-width="1"/></g><line x1="156" y1="988.8" x2="1852" y2="988.8" stroke="#D2D7DF" stroke-width="1"/><text x="156" y="1013.28" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#5C6573" text-anchor="start" xml:space="preserve"><tspan>Salvaguardas: backup de todo lo sobrescrito en </tspan><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="14.4" fill="#13171E">.claude/backup-&lt;ts&gt;/</tspan><tspan> · </tspan><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="14.4" fill="#13171E">--prune</tspan><tspan> exige tipear BORRAR · </tspan><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="14.4" fill="#13171E">--force</tspan><tspan> exige tipear FORCE. La herramienta obedece la misma constitución que instala.</tspan></text></g></svg>
