<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><radialGradient id="wash" cx="70%" cy="12%" r="80%"><stop offset="0%" stop-color="#F3E8D2" stop-opacity="1"/><stop offset="100%" stop-color="#F3E8D2" stop-opacity="0"/></radialGradient></defs><g id="slide-15"><rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF" rx="0"/><rect x="0" y="0" width="88" height="1080" fill="#F2F4F8" rx="0"/><line x1="88" y1="0" x2="88" y2="1080" stroke="#D2D7DF" stroke-width="1"/><text transform="translate(50 92) rotate(90)" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="2.2" fill="#A8761C">EMPEZAR</text><line x1="44" y1="300" x2="44" y2="950" stroke="#BBC3CE" stroke-width="1"/><text transform="translate(49 970) rotate(90)" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="12.5" fill="#5C6573">VII</text><text x="156" y="76" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="2.1" fill="#A8761C" text-anchor="start">CÓMO EMPEZAR HOY</text><text x="1852" y="76" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="13" fill="#5C6573" text-anchor="end">15 / 15</text><line x1="156" y1="98" x2="1852" y2="98" stroke="#D2D7DF" stroke-width="1"/><text x="156" y="144" font-family="Georgia, Constantia, Charter, serif" font-size="50" fill="#13171E">Dos caminos, el mismo comando</text><g id="cards"><rect x="156" y="178" width="833" height="198.81000000000006" fill="#F2F4F8" stroke="#D2D7DF" stroke-width="1" rx="2"/><rect x="156" y="178" width="833" height="3" fill="#0F7A4A" rx="0"/><text x="180" y="212" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="12.5" font-weight="600" letter-spacing="1.6" fill="#0F7A4A" text-anchor="start">PROYECTO NUEVO</text><text x="180" y="241.26" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="15.3" fill="#13171E">npx github:ialvarezsoutec/souclaude-harness#v1</tspan></text><g id="bullets"><circle cx="185" cy="272.65" r="3.5" fill="#A8761C"/><text x="200" y="277.13" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Responde nombre, tipo, stack e idioma.</tspan></text><circle cx="185" cy="305.37" r="3.5" fill="#A8761C"/><text x="200" y="309.85" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Conecta el Vault y completa P7 y P8.</tspan></text><circle cx="185" cy="338.09000000000003" r="3.5" fill="#A8761C"/><text x="200" y="342.57000000000005" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Abre el repo con Claude Code y arranca.</tspan></text></g></g><g id="cards"><rect x="1019" y="178" width="833" height="198.81000000000006" fill="#F2F4F8" stroke="#D2D7DF" stroke-width="1" rx="2"/><rect x="1019" y="178" width="833" height="3" fill="#2F6BA8" rx="0"/><text x="1043" y="212" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="12.5" font-weight="600" letter-spacing="1.6" fill="#2F6BA8" text-anchor="start">PROYECTO EXISTENTE</text><text x="1043" y="241.26" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="15.3" fill="#13171E">npx …#v1 status</tspan><tspan> y después </tspan><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="15.3" fill="#13171E">npx …#v1 upgrade --dry-run</tspan></text><g id="bullets"><circle cx="1048" cy="272.65" r="3.5" fill="#A8761C"/><text x="1063" y="277.13" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Lee el plan antes de aplicar nada.</tspan></text><circle cx="1048" cy="305.37" r="3.5" fill="#A8761C"/><text x="1063" y="309.85" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Revisa cada </tspan><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="14.4" fill="#13171E">.new</tspan><tspan> con </tspan><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="14.4" fill="#13171E">git diff --no-index</tspan><tspan>.</tspan></text><circle cx="1048" cy="338.09000000000003" r="3.5" fill="#A8761C"/><text x="1063" y="342.57000000000005" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Desde Claude Code: </tspan><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="14.4" fill="#13171E">/harness-upgrade</tspan><tspan>.</tspan></text></g></g><g id="cards"><rect x="156" y="398.81000000000006" width="553.3333333333334" height="147.95000000000005" fill="#F2F4F8" stroke="#D2D7DF" stroke-width="1" rx="2"/><text x="180" y="432.81000000000006" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="12.5" font-weight="600" letter-spacing="1.6" fill="#A8761C" text-anchor="start">ANTES DE CADA TASK</text><text x="180" y="462.07000000000005" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="15.3" fill="#13171E">git -C "&lt;vault&gt;" pull --rebase</tspan><tspan>, lee el kanban y mueve tu</tspan></text><text x="180" y="486.72" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>tarjeta </tspan><tspan font-weight="650" fill="#13171E">al empezar</tspan><tspan>. Si ya la tiene otra persona, para y</tspan></text><text x="180" y="511.37000000000006" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>pregunta.</tspan></text><rect x="727.3333333333334" y="398.81000000000006" width="553.3333333333334" height="147.95000000000005" fill="#F2F4F8" stroke="#D2D7DF" stroke-width="1" rx="2"/><text x="751.3333333333334" y="432.81000000000006" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="12.5" font-weight="600" letter-spacing="1.6" fill="#A8761C" text-anchor="start">ANTES DE CADA PR</text><text x="751.3333333333334" y="462.07000000000005" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="15.3" fill="#13171E">/constitution-check</tspan><tspan> audita tu diff contra P1-P10 y te</tspan></text><text x="751.3333333333334" y="486.72" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>marca las violaciones con archivo y línea. Completa la</tspan></text><text x="751.3333333333334" y="511.37000000000006" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>plantilla de PR de verdad.</tspan></text><rect x="1298.6666666666667" y="398.81000000000006" width="553.3333333333334" height="147.95000000000005" fill="#F2F4F8" stroke="#D2D7DF" stroke-width="1" rx="2"/><text x="1322.6666666666667" y="432.81000000000006" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="12.5" font-weight="600" letter-spacing="1.6" fill="#A8761C" text-anchor="start">CUANDO DUDES</text><text x="1322.6666666666667" y="462.07000000000005" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Las fuentes de verdad son </tspan><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="15.3" fill="#13171E">docs/constitution.md</tspan><tspan>, </tspan><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="15.3" fill="#13171E">AGENTS.md</tspan></text><text x="1322.6666666666667" y="486.72" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>y </tspan><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="15.3" fill="#13171E">progress/README.md</tspan><tspan>. Si algo es ambiguo: </tspan><tspan font-weight="650" fill="#13171E">para y</tspan></text><text x="1322.6666666666667" y="511.37000000000006" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan font-weight="650" fill="#13171E">pregunta</tspan><tspan>.</tspan></text></g><line x1="156" y1="988.8" x2="1852" y2="988.8" stroke="#D2D7DF" stroke-width="1"/><text x="156" y="1013.28" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#5C6573" text-anchor="start" xml:space="preserve"><tspan>P9 — Simplicity First y P10 — Surgical Changes aplican siempre, en todo proyecto. Todo lo demás es andamiaje para que esas dos se cumplan solas.</tspan></text></g></svg>
