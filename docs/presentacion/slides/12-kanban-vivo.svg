ext></g><text x="156" y="414.04" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan font-weight="650" fill="#13171E">La tarjeta se mueve al empezar</tspan><tspan>, no al terminar. Por eso el tablero sirve como señal en vivo</tspan></text><text x="156" y="441.04" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>y no como reporte tardío.</tspan></text><g id="table"><text x="156" y="488" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="1.5" fill="#5C6573" text-anchor="start">QUIÉN</text><text x="394.92878048780494" y="488" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="1.5" fill="#5C6573" text-anchor="start">MUEVE LA TARJETA</text><line x1="156" y1="500" x2="1009.3170731707318" y2="500" stroke="#BBC3CE" stroke-width="1"/><text x="156" y="524.48" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="14.4" fill="#13171E">spec-author</tspan></text><text x="394.92878048780494" y="524.48" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>La crea en </tspan><tspan font-weight="650" fill="#13171E">Backlog</tspan><tspan> al emitir </tspan><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="14.4" fill="#13171E">tasks.md</tspan><tspan>.</tspan></text><line x1="156" y1="540.76" x2="1009.3170731707318" y2="540.76" stroke="#D2D7DF" stroke-width="1"/><text x="156" y="559.24" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="14.4" fill="#13171E">implementer</tspan></text><text x="394.92878048780494" y="559.24" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>A </tspan><tspan font-weight="650" fill="#13171E">En curso</tspan><tspan> al tomarla; a </tspan><tspan font-weight="650" fill="#13171E">En review</tspan><tspan> al cerrarla.</tspan></text><line x1="156" y1="575.52" x2="1009.3170731707318" y2="575.52" stroke="#D2D7DF" stroke-width="1"/><text x="156" y="594" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="14.4" fill="#13171E">reviewer</tspan></text><text x="394.92878048780494" y="594" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>A </tspan><tspan font-weight="650" fill="#13171E">Hecho</tspan><tspan> con </tspan><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="14.4" fill="#13171E">APPROVED</tspan><tspan>, o de vuelta a </tspan><tspan font-weight="650" fill="#13171E">En curso</tspan><tspan>.</tspan></text><line x1="156" y1="610.28" x2="1009.3170731707318" y2="610.28" stroke="#D2D7DF" stroke-width="1"/></g><g id="terminal"><rect x="1039.3170731707319" y="400" width="812.6829268292684" height="115.33000000000001" fill="#14181F" stroke="#2B323D" stroke-width="1" rx="3"/><text x="1061.3170731707319" y="432.4" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="15.5" fill="#79838F" xml:space="preserve"># obligatorio antes de tomar un task</text><text x="1061.3170731707319" y="457.51" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="15.5" fill="#D9A441" xml:space="preserve">$ </text><text x="1079.948073170732" y="457.51" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="15.5" fill="#DCE2EA" xml:space="preserve">git -C "&lt;vault&gt;" pull --rebase</text><text x="1061.3170731707319" y="482.62" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="15.5" fill="#79838F" xml:space="preserve"># y lee Project-REA/kanban.md</text></g><g id="cards"><rect x="1039.3170731707319" y="537.33" width="812.6829268292684" height="209.25" fill="#F2F4F8" stroke="#D2D7DF" stroke-width="1" rx="2"/><rect x="1039.3170731707319" y="537.33" width="812.6829268292684" height="3" fill="#B23A26" rx="0"/><text x="1063.3170731707319" y="571.33" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="12.5" font-weight="600" letter-spacing="1.6" fill="#B23A26" text-anchor="start">EL ANTI-SOLAPAMIENTO</text><text x="1063.3170731707319" y="600.59" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Si la tarjeta ya está en </tspan><tspan font-weight="650" fill="#13171E">En curso</tspan><tspan> con otro dueño, la está trabajando otra persona u</tspan></text><text x="1063.3170731707319" y="625.24" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>otra máquina: </tspan><tspan font-weight="650" fill="#13171E">paras y preguntas</tspan><tspan>. No la tomas, no la mueves y no saltas a otra por tu</tspan></text><text x="1063.3170731707319" y="649.89" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>cuenta.</tspan></text><text x="1063.3170731707319" y="686.5400000000001" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Una tarjeta = una línea, así que dos personas nunca se contradicen al hacer merge: se</tspan></text><text x="1063.3170731707319" y="711.19" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>conservan ambas.</tspan></text></g></g></svg>
