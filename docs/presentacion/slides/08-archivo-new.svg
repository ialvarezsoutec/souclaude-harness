<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><radialGradient id="wash" cx="70%" cy="12%" r="80%"><stop offset="0%" stop-color="#F3E8D2" stop-opacity="1"/><stop offset="100%" stop-color="#F3E8D2" stop-opacity="0"/></radialGradient></defs><g id="slide-08"><rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF" rx="0"/><rect x="0" y="0" width="88" height="1080" fill="#F2F4F8" rx="0"/><line x1="88" y1="0" x2="88" y2="1080" stroke="#D2D7DF" stroke-width="1"/><text transform="translate(50 92) rotate(90)" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="2.2" fill="#A8761C">PROYECTO EXISTENTE</text><line x1="44" y1="300" x2="44" y2="950" stroke="#BBC3CE" stroke-width="1"/><text transform="translate(49 970) rotate(90)" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="12.5" fill="#5C6573">III</text><text x="156" y="76" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="2.1" fill="#A8761C" text-anchor="start">PROYECTO EXISTENTE · MANTENERLO AL DÍA</text><text x="1852" y="76" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="13" fill="#5C6573" text-anchor="end">08 / 15</text><line x1="156" y1="98" x2="1852" y2="98" stroke="#D2D7DF" stroke-width="1"/><text x="156" y="144" font-family="Georgia, Constantia, Charter, serif" font-size="50" fill="#13171E">Qué haces cuando aparece un .new</text><g id="terminal"><rect x="156" y="178" width="833" height="325.12" fill="#14181F" stroke="#2B323D" stroke-width="1" rx="3"/><text x="178" y="210.8" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="16" fill="#79838F" xml:space="preserve"># 1 · ¿estoy al día?</text><text x="178" y="236.72000000000003" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="16" fill="#D9A441" xml:space="preserve">$ </text><text x="197.232" y="236.72000000000003" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="16" fill="#DCE2EA" xml:space="preserve">npx …#v1 status</text><text x="178" y="262.64" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="16" fill="#79838F" xml:space="preserve">→ salida 1: hay una versión nueva</text><text x="178" y="288.56" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="16" fill="#DCE2EA" xml:space="preserve"></text><text x="178" y="314.48" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="16" fill="#79838F" xml:space="preserve"># 2 · ¿qué cambiaría?</text><text x="178" y="340.40000000000003" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="16" fill="#D9A441" xml:space="preserve">$ </text><text x="197.232" y="340.40000000000003" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="16" fill="#DCE2EA" xml:space="preserve">npx …#v1 upgrade --dry-run</text><text x="178" y="366.32000000000005" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="16" fill="#DCE2EA" xml:space="preserve"></text><text x="178" y="392.24" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="16" fill="#79838F" xml:space="preserve"># 3 · aplicarlo</text><text x="178" y="418.16" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="16" fill="#D9A441" xml:space="preserve">$ </text><text x="197.232" y="418.16" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="16" fill="#DCE2EA" xml:space="preserve">npx …#v1 upgrade</text><text x="178" y="444.08000000000004" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="16" fill="#3EA372" xml:space="preserve">update</text><text x="235.696" y="444.08000000000004" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="16" fill="#DCE2EA" xml:space="preserve">    .claude/skills/ccem-sdd/</text><text x="178" y="470.00000000000006" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="16" fill="#79838F" xml:space="preserve">conflict</text><text x="254.928" y="470.00000000000006" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="16" fill="#79838F" xml:space="preserve">  CLAUDE.md → CLAUDE.md.new</text></g><g id="note"><rect x="156" y="525.12" width="833" height="79.3" fill="#F3E8D2" rx="2"/><rect x="156" y="525.12" width="3" height="79.3" fill="#A8761C" rx="0"/><text x="178" y="553.38" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Desde Claude Code es un solo comando: </tspan><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="15.3" fill="#13171E">/harness-upgrade</tspan><tspan>. Corre </tspan><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="15.3" fill="#13171E">status</tspan><tspan>, luego el </tspan><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="15.3" fill="#13171E">--dry-run</tspan><tspan>,</tspan></text><text x="178" y="578.03" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan font-weight="650" fill="#13171E">espera tu OK</tspan><tspan> y recién ahí aplica.</tspan></text></g><g id="cards"><rect x="1019" y="178" width="833" height="254.25" fill="#F2F4F8" stroke="#D2D7DF" stroke-width="1" rx="2"/><text x="1043" y="212" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="12.5" font-weight="600" letter-spacing="1.6" fill="#A8761C" text-anchor="start">EL ARCHIVO .NEW</text><text x="1043" y="244" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="650" fill="#13171E">La propuesta queda al lado. Tú decides.</text><text x="1043" y="274.26" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Cuando tu archivo difiere del que el harness querría emitir, no hay pisada y no hay merge</tspan></text><text x="1043" y="298.90999999999997" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>automático: aparece </tspan><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="15.3" fill="#13171E">&lt;archivo&gt;.new</tspan><tspan> junto al tuyo y el original queda intacto.</tspan></text><text x="1043" y="335.56" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Lo comparas con </tspan><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="15.3" fill="#13171E">git diff --no-index CLAUDE.md CLAUDE.md.new</tspan><tspan>, te llevas lo que sirve y</tspan></text><text x="1043" y="360.21" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>borras el </tspan><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="15.3" fill="#13171E">.new</tspan><tspan>.</tspan></text><text x="1043" y="396.86" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Es una </tspan><tspan font-weight="650" fill="#13171E">sugerencia</tspan><tspan>, no una migración pendiente.</tspan></text></g><line x1="156" y1="988.8" x2="1852" y2="988.8" stroke="#D2D7DF" stroke-width="1"/><text x="156" y="1013.28" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#5C6573" text-anchor="start" xml:space="preserve"><tspan>Los dos invariantes que sostienen esto en los tests: </tspan><tspan font-weight="650" fill="#13171E">idempotencia</tspan><tspan> — correr </tspan><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="14.4" fill="#13171E">init</tspan><tspan> dos veces no cambia nada la segunda — y </tspan><tspan font-weight="650" fill="#13171E">pureza de --dry-run</tspan><tspan> — el árbol queda byte-idéntico.</tspan></text></g></svg>
