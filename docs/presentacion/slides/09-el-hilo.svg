<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><radialGradient id="wash" cx="70%" cy="12%" r="80%"><stop offset="0%" stop-color="#F3E8D2" stop-opacity="1"/><stop offset="100%" stop-color="#F3E8D2" stop-opacity="0"/></radialGradient></defs><g id="slide-09"><rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF" rx="0"/><rect x="0" y="0" width="88" height="1080" fill="#F2F4F8" rx="0"/><line x1="88" y1="0" x2="88" y2="1080" stroke="#D2D7DF" stroke-width="1"/><text transform="translate(50 92) rotate(90)" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="2.2" fill="#A8761C">EL HILO</text><line x1="44" y1="300" x2="44" y2="950" stroke="#BBC3CE" stroke-width="1"/><text transform="translate(49 970) rotate(90)" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="12.5" fill="#5C6573">IV</text><text x="156" y="76" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="2.1" fill="#A8761C" text-anchor="start">EL DÍA A DÍA</text><text x="1852" y="76" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="13" fill="#5C6573" text-anchor="end">09 / 15</text><line x1="156" y1="98" x2="1852" y2="98" stroke="#D2D7DF" stroke-width="1"/><text x="156" y="144" font-family="Georgia, Constantia, Charter, serif" font-size="50" fill="#13171E">El ID del hito es el hilo</text><text x="156" y="192.82" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>La roca nace en la reunión trimestral y se descompone en hitos. </tspan><tspan font-weight="650" fill="#13171E">El hito emite el ID</tspan><tspan>, y ese ID reaparece idéntico en cada</tspan></text><text x="156" y="221.32" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>eslabón hasta el release.</tspan></text><g id="chain"><rect x="156" y="257" width="261" height="92" fill="#F2F4F8" stroke="#D2D7DF" stroke-width="1" rx="2"/><rect x="156" y="257" width="261" height="2" fill="#A8761C" rx="0"/><text x="172" y="283" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="1.4" fill="#5C6573" text-anchor="start">ROCA · TRIMESTRE</text><text x="172" y="307" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="16" font-weight="600" fill="#13171E">Q3Y26-REA</text><text x="430" y="311" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" fill="#A8761C" text-anchor="middle">→</text><rect x="443" y="257" width="261" height="92" fill="#F2F4F8" stroke="#D2D7DF" stroke-width="1" rx="2"/><rect x="443" y="257" width="261" height="2" fill="#A8761C" rx="0"/><text x="459" y="283" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="1.4" fill="#5C6573" text-anchor="start">HITO</text><text x="459" y="307" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="16" font-weight="600" fill="#13171E">REA-H3</text><text x="717" y="311" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" fill="#A8761C" text-anchor="middle">→</text><rect x="730" y="257" width="261" height="92" fill="#F2F4F8" stroke="#D2D7DF" stroke-width="1" rx="2"/><rect x="730" y="257" width="261" height="2" fill="#A8761C" rx="0"/><text x="746" y="283" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="1.4" fill="#5C6573" text-anchor="start">CARPETA DE SPEC</text><text x="746" y="307" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="16" font-weight="600" fill="#13171E">specs/REA-H3-captura-lead/</text><text x="1004" y="311" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" fill="#A8761C" text-anchor="middle">→</text><rect x="1017" y="257" width="261" height="92" fill="#F2F4F8" stroke="#D2D7DF" stroke-width="1" rx="2"/><rect x="1017" y="257" width="261" height="2" fill="#A8761C" rx="0"/><text x="1033" y="283" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="1.4" fill="#5C6573" text-anchor="start">RAMA</text><text x="1033" y="307" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="16" font-weight="600" fill="#13171E">feature/REA-H3-captura-lead</text><text x="1291" y="311" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" fill="#A8761C" text-anchor="middle">→</text><rect x="1304" y="257" width="261" height="92" fill="#F2F4F8" stroke="#D2D7DF" stroke-width="1" rx="2"/><rect x="1304" y="257" width="261" height="2" fill="#A8761C" rx="0"/><text x="1320" y="283" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="1.4" fill="#5C6573" text-anchor="start">TASKS</text><text x="1320" y="307" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="16" font-weight="600" fill="#13171E">REA-H3-T001…</text><text x="1578" y="311" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" fill="#A8761C" text-anchor="middle">→</text><rect x="1591" y="257" width="261" height="92" fill="#F2F4F8" stroke="#D2D7DF" stroke-width="1" rx="2"/><rect x="1591" y="257" width="261" height="2" fill="#A8761C" rx="0"/><text x="1607" y="283" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="1.4" fill="#5C6573" text-anchor="start">PR · RELEASE</text><text x="1607" y="307" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="16" font-weight="600" fill="#13171E">squash &amp; merge</text></g><g id="cards"><rect x="156" y="371" width="839" height="184.60000000000002" fill="#F2F4F8" stroke="#D2D7DF" stroke-width="1" rx="2"/><text x="180" y="405" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="12.5" font-weight="600" letter-spacing="1.6" fill="#A8761C" text-anchor="start">POR QUÉ IMPORTA</text><text x="180" y="434.26" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="15.3" fill="#13171E">grep -r REA-H3 specs/</tspan><tspan> y </tspan><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="15.3" fill="#13171E">git log --grep=REA-H3</tspan><tspan> devuelven </tspan><tspan font-weight="650" fill="#13171E">lo mismo</tspan><tspan>. Cualquiera puede</tspan></text><text x="180" y="458.90999999999997" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>reconstruir por qué existe una línea de código sin preguntarle a nadie.</tspan></text><text x="180" y="495.56" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Un hito puede producir varios specs: mismo ID, distinto slug. Cada carpeta es una rama y</tspan></text><text x="180" y="520.21" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>un PR.</tspan></text><rect x="1013" y="371" width="839" height="184.60000000000002" fill="#F2F4F8" stroke="#D2D7DF" stroke-width="1" rx="2"/><rect x="1013" y="371" width="839" height="3" fill="#B23A26" rx="0"/><text x="1037" y="405" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="12.5" font-weight="600" letter-spacing="1.6" fill="#B23A26" text-anchor="start">LA REGLA DURA</text><text x="1037" y="437" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="650" fill="#13171E">Si no tienes el ID, pregunta. No lo inventes.</text><text x="1037" y="467.26" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Sin ID no hay rama — </tspan><tspan font-weight="650" fill="#13171E">los hotfixes incluidos</tspan><tspan>. La urgencia cambia la prioridad, nunca el</tspan></text><text x="1037" y="491.90999999999997" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>procedimiento. Si una rama o un release no tiene ID, la cadena está rota y se repara antes</tspan></text><text x="1037" y="516.56" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>de seguir.</tspan></text></g></g></svg>
