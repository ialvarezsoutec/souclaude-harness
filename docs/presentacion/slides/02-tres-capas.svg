<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><radialGradient id="wash" cx="70%" cy="12%" r="80%"><stop offset="0%" stop-color="#F3E8D2" stop-opacity="1"/><stop offset="100%" stop-color="#F3E8D2" stop-opacity="0"/></radialGradient></defs><g id="slide-02"><rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF" rx="0"/><rect x="0" y="0" width="88" height="1080" fill="#F2F4F8" rx="0"/><line x1="88" y1="0" x2="88" y2="1080" stroke="#D2D7DF" stroke-width="1"/><text transform="translate(50 92) rotate(90)" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="2.2" fill="#A8761C">QUÉ ES</text><line x1="44" y1="300" x2="44" y2="950" stroke="#BBC3CE" stroke-width="1"/><text transform="translate(49 970) rotate(90)" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="12.5" fill="#5C6573">I</text><text x="156" y="76" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="2.1" fill="#A8761C" text-anchor="start">QUÉ ES</text><text x="1852" y="76" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="13" fill="#5C6573" text-anchor="end">02 / 15</text><line x1="156" y1="98" x2="1852" y2="98" stroke="#D2D7DF" stroke-width="1"/><text x="156" y="144" font-family="Georgia, Constantia, Charter, serif" font-size="50" fill="#13171E">Tres capas que conviene no confundir</text><g id="cards"><rect x="156" y="178" width="553.3333333333334" height="217.59999999999997" fill="#F2F4F8" stroke="#D2D7DF" stroke-width="1" rx="2"/><text x="180" y="212" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="12.5" font-weight="600" letter-spacing="1.6" fill="#A8761C" text-anchor="start">EL MÉTODO</text><text x="180" y="244" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="650" fill="#13171E">CCEM</text><text x="180" y="274.26" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Los principios, el flujo Spec-Driven, el prompting</tspan></text><text x="180" y="298.90999999999997" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>anti-hack, la trazabilidad y los criterios para evaluar</tspan></text><text x="180" y="323.56" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>herramientas.</tspan></text><text x="180" y="360.21" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Vive en </tspan><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="15.3" fill="#13171E">.claude/skills/</tspan><tspan> y </tspan><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="15.3" fill="#13171E">docs/constitution.md</tspan></text><rect x="727.3333333333334" y="178" width="553.3333333333334" height="217.59999999999997" fill="#F2F4F8" stroke="#D2D7DF" stroke-width="1" rx="2"/><text x="751.3333333333334" y="212" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="12.5" font-weight="600" letter-spacing="1.6" fill="#A8761C" text-anchor="start">CÓMO SE EJECUTA</text><text x="751.3333333333334" y="244" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="650" fill="#13171E">Orquestación multiagente</text><text x="751.3333333333334" y="274.26" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Un patrón </tspan><tspan font-weight="650" fill="#13171E">opt-in</tspan><tspan>: cuatro roles con herramientas acotadas</tspan></text><text x="751.3333333333334" y="298.90999999999997" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>que hacen cumplir CCEM. No corre en cada sesión — lo</tspan></text><text x="751.3333333333334" y="323.56" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>pides cuando lo quieres.</tspan></text><text x="751.3333333333334" y="360.21" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Vive en </tspan><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="15.3" fill="#13171E">.claude/agents/</tspan><tspan> y </tspan><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="15.3" fill="#13171E">AGENTS.md</tspan></text><rect x="1298.6666666666667" y="178" width="553.3333333333334" height="217.59999999999997" fill="#F2F4F8" stroke="#D2D7DF" stroke-width="1" rx="2"/><text x="1322.6666666666667" y="212" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="12.5" font-weight="600" letter-spacing="1.6" fill="#A8761C" text-anchor="start">EL VEHÍCULO</text><text x="1322.6666666666667" y="244" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="650" fill="#13171E">souclaude-harness</text><text x="1322.6666666666667" y="274.26" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>El CLI que emite y mantiene al día todo lo anterior en</tspan></text><text x="1322.6666666666667" y="298.90999999999997" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>cualquier repo: uno vacío, uno legacy o uno con una</tspan></text><text x="1322.6666666666667" y="323.56" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>versión vieja.</tspan></text><text x="1322.6666666666667" y="360.21" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Vive en </tspan><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="15.3" fill="#13171E">src/</tspan><tspan>, </tspan><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="15.3" fill="#13171E">templates/</tspan><tspan> y </tspan><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="15.3" fill="#13171E">bin/cli.mjs</tspan></text></g><line x1="156" y1="988.8" x2="1852" y2="988.8" stroke="#D2D7DF" stroke-width="1"/><text x="156" y="1013.28" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#5C6573" text-anchor="start" xml:space="preserve"><tspan>Las skills son </tspan><tspan font-weight="650" fill="#13171E">project-local</tspan><tspan>: se commitean con el repo. Quien clona, las tiene — no hay instalación por persona ni por máquina.</tspan></text></g></svg>
