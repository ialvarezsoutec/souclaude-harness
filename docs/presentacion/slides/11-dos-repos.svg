<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><radialGradient id="wash" cx="70%" cy="12%" r="80%"><stop offset="0%" stop-color="#F3E8D2" stop-opacity="1"/><stop offset="100%" stop-color="#F3E8D2" stop-opacity="0"/></radialGradient></defs><g id="slide-11"><rect x="0" y="0" width="1920" height="1080" fill="#FFFFFF" rx="0"/><rect x="0" y="0" width="88" height="1080" fill="#F2F4F8" rx="0"/><line x1="88" y1="0" x2="88" y2="1080" stroke="#D2D7DF" stroke-width="1"/><text transform="translate(50 92) rotate(90)" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="2.2" fill="#A8761C">EQUIPO</text><line x1="44" y1="300" x2="44" y2="950" stroke="#BBC3CE" stroke-width="1"/><text transform="translate(49 970) rotate(90)" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="12.5" fill="#5C6573">V</text><text x="156" y="76" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="2.1" fill="#A8761C" text-anchor="start">TRABAJO EN EQUIPO</text><text x="1852" y="76" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="13" fill="#5C6573" text-anchor="end">11 / 15</text><line x1="156" y1="98" x2="1852" y2="98" stroke="#D2D7DF" stroke-width="1"/><text x="156" y="144" font-family="Georgia, Constantia, Charter, serif" font-size="50" fill="#13171E">Dos repos con reglas opuestas, a propósito</text><g id="cards"><rect x="156" y="178" width="839" height="256.46000000000004" fill="#F2F4F8" stroke="#D2D7DF" stroke-width="1" rx="2"/><rect x="156" y="178" width="839" height="3" fill="#2F6BA8" rx="0"/><text x="180" y="212" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="12.5" font-weight="600" letter-spacing="1.6" fill="#2F6BA8" text-anchor="start">REPO DEL PROYECTO</text><text x="180" y="244" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="650" fill="#13171E">Todo cambio se revisa</text><text x="180" y="274.26" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan font-weight="650" fill="#13171E">Por qué:</tspan><tspan> lo que entra al código pasa por revisión, sin excepciones y sin atajos por</tspan></text><text x="180" y="298.90999999999997" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>urgencia.</tspan></text><g id="bullets"><circle cx="185" cy="330.3" r="3.5" fill="#A8761C"/><text x="200" y="334.78000000000003" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Código, tests, specs y progreso.</tspan></text><circle cx="185" cy="363.02" r="3.5" fill="#A8761C"/><text x="200" y="367.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Siempre </tspan><tspan font-weight="650" fill="#13171E">rama + Pull Request</tspan><tspan>. Nunca directo a </tspan><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="14.4" fill="#13171E">main</tspan><tspan>.</tspan></text><circle cx="185" cy="395.74" r="3.5" fill="#A8761C"/><text x="200" y="400.22" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>El coordinador hace el squash &amp; merge.</tspan></text></g><rect x="1013" y="178" width="839" height="256.46000000000004" fill="#F2F4F8" stroke="#D2D7DF" stroke-width="1" rx="2"/><rect x="1013" y="178" width="839" height="3" fill="#A8761C" rx="0"/><text x="1037" y="212" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="12.5" font-weight="600" letter-spacing="1.6" fill="#A8761C" text-anchor="start">EL VAULT</text><text x="1037" y="244" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="650" fill="#13171E">El tablero refleja el ahora</text><text x="1037" y="274.26" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan font-weight="650" fill="#13171E">Por qué:</tspan><tspan> si el tablero esperara a un merge, mostraría el pasado. Tiene que mostrar el</tspan></text><text x="1037" y="298.90999999999997" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>ahora.</tspan></text><g id="bullets"><circle cx="1042" cy="330.3" r="3.5" fill="#A8761C"/><text x="1057" y="334.78000000000003" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Kanban, espejos de specs y progreso, rocas, evidencia.</tspan></text><circle cx="1042" cy="363.02" r="3.5" fill="#A8761C"/><text x="1057" y="367.5" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan font-weight="650" fill="#13171E">Push directo a `main`</tspan><tspan>, sin P</tspan></text><circle cx="1042" cy="395.74" r="3.5" fill="#A8761C"/><text x="1057" y="400.22" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Repo aparte, para no ensuciar el del proyecto.</tspan></text></g></g><g id="note"><rect x="156" y="456.46000000000004" width="552" height="54.65" fill="#E3ECF7" rx="2"/><rect x="156" y="456.46000000000004" width="3" height="54.65" fill="#2F6BA8" rx="0"/><text x="178" y="484.72" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Nunca se cruzan: código, diffs y tests </tspan><tspan font-weight="650" fill="#13171E">jamás</tspan><tspan> van al Vault.</tspan></text></g><g id="note"><rect x="728" y="456.46000000000004" width="552" height="79.3" fill="#F3E8D2" rx="2"/><rect x="728" y="456.46000000000004" width="3" height="79.3" fill="#A8761C" rx="0"/><text x="750" y="484.72" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>La ruta local vive en </tspan><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="15.3" fill="#13171E">.claude/vault.local.json</tspan><tspan>, que escribe</tspan></text><text x="750" y="509.37" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>el instalador.</tspan></text></g><g id="note"><rect x="1300" y="456.46000000000004" width="552" height="79.3" fill="#F7E4E0" rx="2"/><rect x="1300" y="456.46000000000004" width="3" height="79.3" fill="#B23A26" rx="0"/><text x="1322" y="484.72" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Si el Vault no está configurado, el espejo </tspan><tspan font-weight="650" fill="#13171E">se omite sin</tspan></text><text x="1322" y="509.37" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan font-weight="650" fill="#13171E">fallar</tspan><tspan>. El trabajo local nunca se bloquea.</tspan></text></g></g></svg>
