t-size="15.3" fill="#13171E">estimado</tspan><tspan> sirve para </tspan><tspan font-weight="650" fill="#13171E">comparar</tspan><tspan> celdas de la matriz e hitos</tspan></text><text x="1022.6829268292684" y="440.56" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>entre sí — </tspan><tspan font-weight="650" fill="#13171E">jamás</tspan><tspan> se presenta como cifra contable ni de facturación.</tspan></text></g><g id="cards"><rect x="998.6829268292684" y="497.95" width="853.3170731707318" height="198.81000000000012" fill="#F2F4F8" stroke="#D2D7DF" stroke-width="1" rx="2"/><text x="1022.6829268292684" y="531.95" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="12.5" font-weight="600" letter-spacing="1.6" fill="#A8761C" text-anchor="start">EL RITUAL · /ROCK-CLOSE</text><text x="1022.6829268292684" y="561.21" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Al cerrar el trimestre se resume el JSONL y se ajusta la matriz si:</tspan></text><g id="bullets"><circle cx="1027.6829268292684" cy="592.6" r="3.5" fill="#A8761C"/><text x="1042.6829268292684" y="597.08" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>las escaladas superan el </tspan><tspan font-weight="650" fill="#13171E">10 %</tspan><tspan> de los lanzamientos,</tspan></text><circle cx="1027.6829268292684" cy="625.32" r="3.5" fill="#A8761C"/><text x="1042.6829268292684" y="629.8000000000001" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>una celda </tspan><tspan font-weight="650" fill="#13171E">concentra el rework</tspan><tspan> — su tier quedó corto,</tspan></text><circle cx="1027.6829268292684" cy="658.0400000000001" r="3.5" fill="#A8761C"/><text x="1042.6829268292684" y="662.5200000000001" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>una celda </tspan><tspan font-weight="650" fill="#13171E">nunca falla</tspan><tspan> — puede bajar un tier.</tspan></text></g></g></g></svg>
