ext><text x="1038.982" y="208" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#A8761C" text-anchor="middle">→</text><rect x="1057.982" y="178" width="125.953" height="46" fill="#F2F4F8" stroke="#BBC3CE" stroke-width="1" rx="2"/><text x="1120.9585" y="207" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="17.0" font-weight="600" fill="#13171E" text-anchor="middle">implement</text><text x="1202.935" y="208" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#A8761C" text-anchor="middle">→</text><rect x="1221.935" y="178" width="95.30199999999999" height="46" fill="#F2F4F8" stroke="#BBC3CE" stroke-width="1" rx="2"/><text x="1269.586" y="207" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="17.0" font-weight="600" fill="#13171E" text-anchor="middle">review</text><text x="1336.2369999999999" y="208" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="20" fill="#A8761C" text-anchor="middle">→</text><rect x="1355.2369999999999" y="178" width="54.434" height="46" fill="#F2F4F8" stroke="#BBC3CE" stroke-width="1" rx="2"/><text x="1382.454" y="207" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="17.0" font-weight="600" fill="#13171E" text-anchor="middle">PR</text></g><text x="156" y="260.82" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Hasta que los tres estén aprobados, la rama </tspan><tspan font-weight="650" fill="#13171E">solo admite commits `docs:`</tspan><tspan>. Durante implement el review es incremental, ta</tspan></text><text x="156" y="289.32" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>sk por task — nunca en batch al fin</tspan></text><g id="table"><text x="156" y="337" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="1.5" fill="#5C6573" text-anchor="start">AGENTE</text><text x="372.58000000000004" y="337" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="1.5" fill="#5C6573" text-anchor="start">ROL</text><text x="855.72" y="337" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="1.5" fill="#5C6573" text-anchor="start">¿CÓDIGO?</text><line x1="156" y1="349" x2="989" y2="349" stroke="#BBC3CE" stroke-width="1"/><text x="156" y="373.48" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="14.4" fill="#13171E">orchestrator</tspan></text><text x="372.58000000000004" y="373.48" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Descompone, coordina y hace respetar los checkpoints.</tspan></text><circle cx="860.72" cy="369" r="4.5" fill="#B23A26"/><text x="870.72" y="375" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="16" font-weight="600" fill="#B23A26">no</text><line x1="156" y1="394" x2="989" y2="394" stroke="#D2D7DF" stroke-width="1"/><text x="156" y="412.48" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="14.4" fill="#13171E">spec-author</tspan></text><text x="372.58000000000004" y="412.48" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Redacta spec, plan y tasks — una fase por invocación.</tspan></text><circle cx="860.72" cy="408" r="4.5" fill="#B23A26"/><text x="870.72" y="414" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="16" font-weight="600" fill="#B23A26">no</text><line x1="156" y1="433" x2="989" y2="433" stroke="#D2D7DF" stroke-width="1"/><text x="156" y="451.48" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="14.4" fill="#13171E">implementer</tspan></text><text x="372.58000000000004" y="451.48" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Implementa task por task, cada cambio con su test.</tspan></text><circle cx="860.72" cy="447" r="4.5" fill="#0F7A4A"/><text x="870.72" y="453" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="16" font-weight="600" fill="#0F7A4A">sí</text><line x1="156" y1="472" x2="989" y2="472" stroke="#D2D7DF" stroke-width="1"/><text x="156" y="490.48" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="14.4" fill="#13171E">reviewer</tspan></text><text x="372.58000000000004" y="490.48" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Aprueba o rechaza. Sin herramientas de escritura:</tspan></text><text x="372.58000000000004" y="512.24" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>dictamina.</tspan></text><circle cx="860.72" cy="486" r="4.5" fill="#B23A26"/><text x="870.72" y="492" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="16" font-weight="600" fill="#B23A26">no</text><line x1="156" y1="528.52" x2="989" y2="528.52" stroke="#D2D7DF" stroke-width="1"/></g><g id="note"><rect x="1019" y="325" width="833" height="79.3" fill="#F3E8D2" rx="2"/><rect x="1019" y="325" width="3" height="79.3" fill="#A8761C" rx="0"/><text x="1041" y="353.26" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan font-weight="650" fill="#13171E">La separación es el punto.</tspan><tspan> Quien especifica no implementa, y quien implementa </tspan><tspan font-weight="650" fill="#13171E">no se aprueba</tspan></text><text x="1041" y="377.90999999999997" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan font-weight="650" fill="#13171E">a sí mismo</tspan><tspan>. Un </tspan><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="15.3" fill="#13171E">reviewer</tspan><tspan> sin permiso de escritura no es una recomendación: es enforcement.</tspan></text></g><g id="cards"><rect x="1019" y="426.3" width="833" height="184.59999999999997" fill="#F2F4F8" stroke="#D2D7DF" stroke-width="1" rx="2"/><text x="1043" y="460.3" font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="12.5" font-weight="600" letter-spacing="1.6" fill="#A8761C" text-anchor="start">CUÁNDO NO MONTAR TODO ESTO</text><text x="1043" y="489.56" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Bug fix puntual, ajuste cosmético, spike, script one-off, hotfix o typo: </tspan><tspan font-weight="650" fill="#13171E">se hace directo</tspan><tspan>.</tspan></text><text x="1043" y="514.21" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Ceremonia que no sirve viola P9 — Simplicity First.</tspan></text><text x="1043" y="550.86" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>Para un cambio mediano existe la versión comprimida: </tspan><tspan font-family="Roboto Mono, Cascadia Mono, Consolas, monospace" font-size="15.3" fill="#13171E">/spec-new &lt;ID&gt; &lt;slug&gt; --lite</tspan><tspan>. Mismos</tspan></text><text x="1043" y="575.51" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="400" fill="#39424F" text-anchor="start" xml:space="preserve"><tspan>checkpoints, menos ceremonia.</tspan></text></g></g></svg>
