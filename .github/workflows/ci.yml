name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    # Windows es el entorno real de los devs de SOUTEC (OneDrive, CRLF, rutas con
    # espacios). Ubuntu esta para que el lockfile escrito en Windows se pueda leer
    # desde CI: por eso el hash se normaliza a LF y las rutas van en POSIX.
    # Node 22 custodia el piso de engines (>=22.4, por allowNegative en parseArgs);
    # 24 es la version de trabajo del equipo.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: [22, 24]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - run: npm ci

      - run: npm test

      - name: verifica integridad del manifest (huerfanos, rutas rotas, duplicados, criticos)
        run: node bin/cli.mjs verify --strict

      # El CLI tiene que poder instalarse sobre un repo real sin escribir nada.
      - name: dry-run sobre el propio repo
        run: node bin/cli.mjs upgrade --dry-run --yes

  reglas-pr:
    # Reglas deterministas de la skill soutec-github (rama, commits, secretos,
    # base=dev, mergeable, version, secciones de la plantilla). Solo corre en
    # PR: necesita gh pr view para leer el cuerpo del PR.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: verifica reglas de PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: node scripts/check-pr-rules.mjs --pr ${{ github.event.pull_request.number }}
